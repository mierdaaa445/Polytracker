name: track
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tracker.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_USD: "50"
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add seen.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
