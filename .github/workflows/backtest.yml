name: backtest
on:
  workflow_dispatch:
  push:
    paths:
      - backtest.py
      - .github/workflows/backtest.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 backtest.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add backtest.md
          git diff --cached --quiet || (git commit -m "backtest" && git pull --rebase && git push)
